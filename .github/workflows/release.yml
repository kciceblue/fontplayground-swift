name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      adhoc:
        description: Build an ad-hoc dry run without release credentials
        type: boolean
        default: true
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/**", "App/project.yml", "tools/release/**"]

permissions:
  contents: write

env:
  UV_PYTHON: "3.12"
  SWIFT_TEST_FLAGS: --no-parallel

jobs:
  release:
    if: ${{ success() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, kcice-ci, kcice-build]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fail in seconds, not after the test suite, when a signed build is missing a credential.
      - name: Check release secrets
        if: ${{ !(github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.adhoc)) }}
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          missing=()
          for name in MACOS_DEVELOPER_ID_P12_BASE64 MACOS_DEVELOPER_ID_P12_PASSWORD MACOS_DEVELOPER_ID_IDENTITY \
            NOTARY_API_KEY_P8_BASE64 NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing release secrets: ${missing[*]}. See docs/release.md, Configure GitHub releases."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]] && ! command -v gh >/dev/null; then
            echo "::error::The Draft GitHub release step needs the GitHub CLI (gh) on this runner."
            exit 1
          fi
      - name: Verify installed macOS toolchain
        run: scripts/check-macos-toolchain.sh
      - name: Read pinned tool versions
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/pbs
          key: pbs-${{ hashFiles('scripts/python-runtime.pin') }}
      - run: make setup
      - run: make lint test
      - name: Import Developer ID certificate and notary key
        if: ${{ !(github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.adhoc)) }}
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 32)
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before.txt"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          existing=()
          while IFS= read -r line; do
            line="${line#*\"}"; line="${line%\"*}"
            existing+=("$line")
          done < "$RUNNER_TEMP/keychains-before.txt"
          # A fleet job's fresh HOME has no user keychains. macOS's bash 3.2 calls an empty "${existing[@]}" unbound
          # under `set -u`, so expand it only when it has items.
          security list-keychains -d user -s "$keychain" ${existing[@]+"${existing[@]}"}
          rm -f "$RUNNER_TEMP/release.p12"
          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
      - name: Build notarized release
        if: ${{ !(github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.adhoc)) }}
        env:
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          version=()
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then version=(--version "${GITHUB_REF_NAME#v}"); fi
          scripts/release.sh --identity "$MACOS_DEVELOPER_ID_IDENTITY" "${version[@]}" --build-number "$GITHUB_RUN_NUMBER"
      - name: Build ad-hoc dry run
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.adhoc) }}
        run: scripts/release.sh --adhoc --build-number "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FontPlayground-arm64
          path: dist/*
          if-no-files-found: error
      - name: Draft GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Curated notes for users when they exist; otherwise GitHub's list of merged PRs.
          notes=(--generate-notes)
          if [[ -f "docs/release/notes/$GITHUB_REF_NAME.md" ]]; then notes=(--notes-file "docs/release/notes/$GITHUB_REF_NAME.md"); fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --draft --verify-tag \
            --title "Font Playground ${GITHUB_REF_NAME#v}" "${notes[@]}"
      - name: Remove release credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/keychains-before.txt" ]]; then
            existing=()
            while IFS= read -r line; do
              line="${line#*\"}"; line="${line%\"*}"
              existing+=("$line")
            done < "$RUNNER_TEMP/keychains-before.txt"
            security list-keychains -d user -s ${existing[@]+"${existing[@]}"}
          fi
          if [[ -f "$RUNNER_TEMP/release.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/release.keychain-db"; fi
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/keychains-before.txt"
